name: Build Blink Chromium for iOS

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Run the full content_shell build (false = diagnose ccache only)'
        required: false
        default: true
        type: boolean
      jobs:
        description: 'Parallel ninja jobs (-j)'
        required: false
        default: '3'
        type: choice
        options:
          - '2'
          - '3'
      pin_rev:
        description: 'Exact source revision to build (overrides restored pin)'
        required: false
        default: ''
        type: string

env:
  DEPOT_TOOLS_PATH: /Users/runner/work/_temp/depot_tools

jobs:
  build-ios-blink:
    name: Build content_shell (Blink) for iOS device
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Environment info
        run: |
          sw_vers
          xcodebuild -version
          echo "--- disk before ---"
          df -h /
          sysctl -n hw.ncpu
          sysctl -n hw.memsize

      - name: Free disk space (keep only default Xcode, drop simulators)
        run: |
          set -x
          default_xcode=$(xcode-select -p | sed 's#/Contents/Developer##')
          echo "Default Xcode: $default_xcode"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$default_xcode" ]; then
              echo "Removing $app"
              sudo rm -rf "$app" &
            fi
          done
          wait
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true
          sudo rm -rf /Applications/Simulator.app 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf /Library/Developer/Toolchains 2>/dev/null || true
          sudo rm -rf ~/Library/Caches/* 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf ~/.cargo ~/.rustup ~/.gradle ~/.m2 ~/.npm 2>/dev/null || true
          echo "--- disk after cleanup ---"
          df -h /

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_PATH"
          echo "$DEPOT_TOOLS_PATH" >> "$GITHUB_PATH"
          echo "$DEPOT_TOOLS_PATH/python-bin" >> "$GITHUB_PATH"
          git --version
          python3 --version

      - name: Restore ccache + pinned source revision
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /Users/runner/work/ccache
            /Users/runner/work/chromium/src-rev.txt
          key: blink-ccache-${{ github.run_id }}
          restore-keys: |
            blink-ccache-

      - name: Stash restored source revision (for pinning after fetch)
        if: always()
        run: |
          if [ -s /Users/runner/work/chromium/src-rev.txt ]; then
            cp /Users/runner/work/chromium/src-rev.txt /tmp/pinned-rev.txt
            echo "Stashed pinned revision: $(cat /tmp/pinned-rev.txt)"
          else
            echo "No restored revision to stash"
          fi

      - name: Fetch Chromium source (shallow, no history)
        timeout-minutes: 120
        run: |
          set -x
          mkdir -p /Users/runner/work/chromium
          cd /Users/runner/work/chromium
          fetch --no-history --nohooks ios
          # Record the exact source revision so future runs can check out the
          # same code (keeps ccache hits valid across runs).
          git -C src rev-parse HEAD > /Users/runner/work/chromium/src-rev.txt
          cat /Users/runner/work/chromium/src-rev.txt
          echo "--- disk after fetch ---"
          df -h /
          du -sh src 2>/dev/null || true

      - name: Check out pinned source revision (if any)
        run: |
          cd /Users/runner/work/chromium/src
          if [ -n "${{ inputs.pin_rev }}" ]; then
            REV="${{ inputs.pin_rev }}"
            echo "Using manual pin_rev: $REV"
          elif [ -s /tmp/pinned-rev.txt ]; then
            REV=$(cat /tmp/pinned-rev.txt)
            echo "Pinning src to restored revision $REV"
          else
            echo "No pinned revision found - using freshly fetched source"
            REV=""
          fi
          if [ -n "$REV" ]; then
            git fetch origin "$REV" --depth 1
            git checkout "$REV"
            gclient sync --nohooks
            echo "Now at: $(git rev-parse HEAD)"
            # Record the revision we ACTUALLY built (not the fetch-time HEAD) so
            # the next run pins to the same source and ccache hits stay valid.
            git rev-parse HEAD > /Users/runner/work/chromium/src-rev.txt
            echo "Saved built revision to src-rev.txt"
          fi

      - name: Configure GN for Blink (use_blink=true)
        run: |
          cd /Users/runner/work/chromium
          cat > .setup-gn <<'EOF'
          [gn_args]
          use_blink = true
          ios_content_shell_bundle_identifier = "com.example.blinkcontent"
          ios_enable_code_signing = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_enable_lite_mode = true
          cc_wrapper = "ccache"
          optimize_for_size = true
          use_siso = false
          EOF
          gclient runhooks
          echo "--- running setup-gn.py to generate build dirs ---"
          python3 src/ios/build/tools/setup-gn.py
          echo "--- build dirs generated ---"
          ls -la src/out 2>/dev/null || true

      - name: Trim build dirs (keep only Release-iphoneos)
        run: |
          cd /Users/runner/work/chromium/src
          rm -rf out/Debug-iphonesimulator out/Release-iphonesimulator out/Debug-iphoneos 2>/dev/null || true
          echo "--- disk after gn gen ---"
          df -h /
          ls -la out/Release-iphoneos 2>/dev/null | head

      - name: Install ccache
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:$PATH"
          which ccache || brew install ccache
          ccache --version | head -1
          mkdir -p /Users/runner/work/ccache

      - name: Build content_shell (Blink) for device
        timeout-minutes: 295
        env:
          CCACHE_DIR: /Users/runner/work/ccache
          CCACHE_BASEDIR: /Users/runner/work
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: 8G
          CCACHE_SLOPPINESS: time_macros,modules
          CCACHE_DEPEND: "1"
          CCACHE_COMPILERCHECK: content
          CCACHE_LOGFILE: /Users/runner/work/ccachelog.txt
        run: |
          cd /Users/runner/work/chromium/src/out/Release-iphoneos

          echo "=== ccache stats BEFORE build (restored from previous run) ==="
          ccache -sv | head -80 || true

          if [ "${{ inputs.full_build }}" != "true" ]; then
            echo "=== DIAGNOSE-ONLY: sample compile commands ==="
            B=/Users/runner/work/chromium/src/out/Release-iphoneos
            ninja -C "$B" -t commands > /tmp/commands.txt 2>&1 || true
            echo "command db: $(wc -l < /tmp/commands.txt) lines"
            tail -2 /tmp/commands.txt || true
            grep -E 'clang\+\+.* -c ' /tmp/commands.txt | head -1 > /tmp/sample1.sh || true
            grep -E ' -c [^ ]+\.c ' /tmp/commands.txt | head -1 > /tmp/sample2.sh || true
            grep -E ' -c [^ ]+\.mm ' /tmp/commands.txt | head -1 > /tmp/sample3.sh || true
            i=0
            for f in /tmp/sample1.sh /tmp/sample2.sh /tmp/sample3.sh; do
              i=$((i+1))
              echo "=== SAMPLE $i command: ==="
              cat "$f" || true
              if [ -s "$f" ]; then
                CCACHE_DEBUG=1 bash "$f" > /tmp/sample_out_$i.txt 2>&1 || echo "(compile failed - see sample_out_$i.txt)"
                echo "--- ccache debug decision ---"
                cat ccache.debug.*.log 2>/dev/null | grep -iE 'result|miss|hit|unsupported|could not|too hard|disabled|sloppiness|direct mode|depend mode|hash|preprocess|compiler check' | head -25 || true
                rm -f ccache.debug.*.log
              fi
            done
            echo "=== ccache stats after samples ==="
            ccache -sv | head -40 || true
          fi

          ccache -z || true

          if [ "${{ inputs.full_build }}" == "true" ]; then
            echo "=== FULL BUILD (ninja -j${{ inputs.jobs }}) ==="
            autoninja -C /Users/runner/work/chromium/src/out/Release-iphoneos -j${{ inputs.jobs }} content_shell
            echo "--- ccache stats ---"
            ccache -sv
            echo "--- disk after build ---"
            df -h /
            ls -la /Users/runner/work/chromium/src/out/Release-iphoneos/content_shell.app 2>/dev/null || true
          else
            echo "=== DIAGNOSE-ONLY: skipping full build ==="
            ccache -sv
            echo "--- ccache logfile tail ---"
            tail -60 /Users/runner/work/ccachelog.txt 2>/dev/null || true
          fi

      - name: Kill orphan build processes (protects cache save)
        if: always()
        run: |
          pkill -9 -x clang || true
          pkill -9 -x 'clang\+\+' || true
          pkill -9 -x ccache || true
          pkill -9 -x ninja || true
          pkill -9 -x autoninja || true
          pkill -9 -x 'ld64\.lld' || true
          pkill -9 -f 'content_shell' || true
          # Wait for any stragglers to fully exit so the ccache dir quiesces.
          for i in $(seq 1 10); do
            if ! (pgrep -x ccache >/dev/null || pgrep -x clang >/dev/null \
                  || pgrep -x 'clang\+\+' >/dev/null || pgrep -x ninja >/dev/null); then
              break
            fi
            sleep 3
          done
          sleep 3
          echo "orphans cleaned"

      - name: Stage ccache snapshot (protects save from concurrent writes)
        if: always()
        run: |
          # The Actions cache save tars the directory and FAILS if any file
          # changes/removes while it reads (seen twice: 'file changed/removed
          # before we read it'). Snapshot the (now quiescent) cache dir into a
          # fresh dir so the save reads a static tree.
          rm -rf /Users/runner/work/ccache.staged
          cp -a /Users/runner/work/ccache /Users/runner/work/ccache.staged
          rm -rf /Users/runner/work/ccache
          mv /Users/runner/work/ccache.staged /Users/runner/work/ccache
          echo "ccache snapshot staged: $(du -sh /Users/runner/work/ccache | cut -f1)"

      - name: Dump ccache diagnostics (survives build timeout)
        if: always()
        env:
          CCACHE_DIR: /Users/runner/work/ccache
        run: |
          echo "=== ccache stats AFTER build ==="
          ccache -sv | head -80 || true
          echo "=== ccache per-call log reasons (sorted) ==="
          grep -iE 'unsupported|could not|couldn|too hard|compiler check|disabled|Result: cache|internal error|failed|Skipping' /Users/runner/work/ccachelog.txt 2>/dev/null \
            | sed -E 's/^.*\] \[ccache\] //' | sort | uniq -c | sort -rn | head -40 || true
          echo "=== raw log line count ==="
          wc -l /Users/runner/work/ccachelog.txt 2>/dev/null || true

      - name: Save ccache + pinned revision (survives even on build timeout)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /Users/runner/work/ccache
            /Users/runner/work/chromium/src-rev.txt
          key: blink-ccache-${{ github.run_id }}

      - name: Package .ipa
        run: |
          cd /Users/runner/work/chromium/src
          APP=out/Release-iphoneos/content_shell.app
          if [ ! -d "$APP" ]; then
            echo "content_shell.app not found - skipping package (diagnose-only run?)"
            exit 0
          fi
          echo "--- Info.plist bundle id ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" 2>/dev/null || true
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r blink-content-shell.ipa Payload
          ls -la /tmp/ipa/blink-content-shell.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-content-shell-ipa
          path: /tmp/ipa/blink-content-shell.ipa
          if-no-files-found: warn
